[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "typogen"
version = "0.1.0"
authors = [
    { name = "Jay Chooi" }
]
description = "A rule-based typographical noise generator for introducing realistic typos into text"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["typo", "typographical", "noise", "text", "augmentation", "nlp"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/jeqcho/inject-typo"
Repository = "https://github.com/jeqcho/inject-typo"
Issues = "https://github.com/jeqcho/inject-typo/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["typogen*"]
